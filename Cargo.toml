[package]
name = "drydock"
version = "0.1.0"
authors = ["Chris McDonald <cjmcdonald@chromium.org>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
config = "0.10.1"
ignore = "0.4.16"
lazy_static = "1.4.0"
nom = "6.0.0-alpha2"
regex = "1.3.9"

[dependencies.clap]
version = "2.33"
default-features = false

[dependencies.petgraph]
version = "0.5.1"
default-features = false
features = ["graphmap"]