[package]
name = "drydock"
version = "0.2.0"
authors = ["Chris McDonald <cjmcdonald@chromium.org>"]
edition = "2024"
license = "BSD-3-Clause"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "drydock"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
colored = "3"
config = "0.15"
ignore = "0.4.16"
float-ord = "0.3"
lazy_static = "1.4.0"
nom = "8"
nom_locate = { version = "5", features = ["stable-deref-trait"] }
regex = "1.3.9"
self_cell = "1"
serde = { version = "1.0", features = ["derive"] }
shellexpand = "3"
source-span = "2.2.0"
strsim = "0.11"
toml = "1"
walkdir = "2.3.1"

[dependencies.clap]
version = "4"
features = ["std", "help", "usage", "error-context"]
default-features = false

[dependencies.petgraph]
version = "0.8"
default-features = false
features = ["graphmap"]

[dev-dependencies]
assert_cmd = "2"
proptest = "1"
tempfile = "3"
